services:
  - type: web
    name: cm-odontologia-sistema
    env: python
    # El servicio corre en Starter y aqui decia free. Mientras nadie tocaba
    # este archivo daba igual, pero cualquier cambio sincroniza el blueprint y
    # le aplica lo que diga: al declarar las variables de DNI le bajo el plan
    # solo. En el gratuito el servicio se apaga por inactividad y tarda casi un
    # minuto en despertar, y la clinica abre a primera hora.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Consulta de DNI y RUC. "sync: false" significa que el valor se escribe
      # en el panel de Render y no aqui: la clave es del consultorio y no tiene
      # por que estar en el repositorio. Declararlas igual evita que una
      # sincronizacion del blueprint las borre por no conocerlas.
      - key: DOC_LOOKUP_KEY
        sync: false
      - key: DOC_LOOKUP_DNI_URL
        sync: false
      - key: DOC_LOOKUP_RUC_URL
        sync: false
