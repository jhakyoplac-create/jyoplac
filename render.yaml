services:
  - type: web
    name: cm-odontologia-sistema
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: dental-data
      mountPath: /var/data
      sizeGB: 1
